[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with constrained decoding for LLMs"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    # Not imported by src/: transformers needs it when llm_sdk loads the
    # model with device_map="auto", which it does on CUDA machines.
    "accelerate>=1.0.0",
]

# Installed by a plain `uv sync` (the reviewer's command), so `make lint` works.
[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]

[tool.uv.sources]
llm-sdk = { path = "./llm_sdk" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
files = ["src"]
exclude = ["(?x)(^\\.venv[^/]*/|^llm_sdk/|^data/|^\\.moulinette/)"]

[tool.flake8]
max-line-length = 88
exclude = [".venv", ".venv-cpu", "llm_sdk", ".moulinette", "__pycache__", ".mypy_cache"]

[tool.coverage.run]
source = ["src"]
patch = ["subprocess"]
